```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dora & Shinchan ❤️</title>
    <link rel="stylesheet" href="game.css">
</head>

<body>

<div id="game">

    <div class="sky">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
    </div>

    <div class="hud">
        <div>❤️ <span id="score">0</span></div>
        <div>🏃 <span id="distance">0</span> m</div>
    </div>

    <!-- START -->
    <div id="startScreen" class="screen">

        <div class="title">DORA'S LOVE RUN ❤️</div>

        <div class="introCharacters">
            <div class="bigDora">👧🏻</div>
            <div class="heart">❤️</div>
            <div class="bigShin">🧒🏻</div>
        </div>

        <p>
            Dora is running away...<br>
            <b>Shinchan is chasing her! 😂</b>
        </p>

        <button id="startBtn">START RUN 💕</button>

        <small>
            ← → Change lane &nbsp; | &nbsp;
            ↑ Jump &nbsp; | &nbsp;
            ↓ Slide
        </small>

    </div>


    <!-- WORLD -->
    <div class="world">

        <div class="track">

            <div class="laneLine leftLine"></div>
            <div class="laneLine rightLine"></div>

            <div id="objects"></div>

            <!-- DORA -->
            <div id="dora" class="dora character">

                <div class="doraHair"></div>

                <div class="doraHead">

                    <div class="eye leftEye"></div>
                    <div class="eye rightEye"></div>

                    <div class="smile"></div>

                </div>

                <div class="doraBody">
                    <div class="doraShirt"></div>
                    <div class="doraShorts"></div>
                </div>

                <div class="doraLegs">
                    <div class="doraLeg leg1"></div>
                    <div class="doraLeg leg2"></div>
                </div>

                <div class="shoe shoe1"></div>
                <div class="shoe shoe2"></div>

            </div>


            <!-- SHINCHAN CHASER -->
            <div id="shinchan" class="shinchan character">

                <div class="shinHead">

                    <div class="shinHair"></div>

                    <div class="shinEye eye1"></div>
                    <div class="shinEye eye2"></div>

                    <div class="shinMouth"></div>

                </div>

                <div class="shinBody">
                    <div class="shinShirt"></div>
                    <div class="shinShorts"></div>
                </div>

                <div class="shinLegs">
                    <div class="shinLeg shinLeg1"></div>
                    <div class="shinLeg shinLeg2"></div>
                </div>

                <div class="shinShoe shinShoe1"></div>
                <div class="shinShoe shinShoe2"></div>

            </div>

        </div>

    </div>


    <!-- GAME OVER -->
    <div id="gameOver" class="screen hidden">

        <div class="gameOverTitle">SHINCHAN CAUGHT DORA! 😂</div>

        <div class="caught">
            🧒🏻 ❤️ 👧🏻
        </div>

        <p>
            He finally caught you! 😭😂
        </p>

        <div class="final">
            Score: <span id="finalScore">0</span>
        </div>

        <button id="restartBtn">RUN AGAIN ❤️</button>

    </div>


    <!-- MOBILE CONTROLS -->
    <div class="controls">

        <button data-action="left">←</button>
        <button data-action="jump">↑</button>
        <button data-action="slide">↓</button>
        <button data-action="right">→</button>

    </div>

</div>

<script src="game.js"></script>

</body>
</html>
```
